<!doctype html>
<!-- iOS home-screen icon, 180x180, same mark as public/favicon.svg. iOS rounds the
     corners itself, so the square is full bleed. Rendered into public/apple-touch-icon.png. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  /*FONTS*/
  * { margin: 0; }
  body { width: 180px; height: 180px; overflow: hidden; position: relative; background: #161616; }
  span { position: absolute; left: 0; width: 146px; top: 38px; text-align: center; font: 800 96px/1 "Nunito"; color: #fcfcfc; }
  i { position: absolute; left: 112px; top: 96px; width: 34px; height: 34px; border-radius: 50%; background: #f0561d; }
</style>
</head>
<body><span>K</span><i></i></body>
</html>
