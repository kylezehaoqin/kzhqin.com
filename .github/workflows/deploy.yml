# Every push and PR runs `check`. Only a push to main also runs `deploy`, which
# ships the exact dist/ that `check` built and tested. The deploy key can only
# run `deploy-gate static kzhqin.com` on the VPS (see kylezehaoqin/infra).
name: deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types and content frontmatter
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        env:
          PUBLIC_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify dist (links, TODOs, drafts, size, JS budget)
        run: npm run verify
      - name: End-to-end tests (fixture build)
        run: |
          npx playwright install --with-deps chromium
          npm run build:e2e
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-kzhqin.com
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Only the build output is published. Nothing else in the repo can reach the site.
          tar -czf - -C dist . \
            | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                deploy@89.116.191.153 "$GITHUB_SHA"
